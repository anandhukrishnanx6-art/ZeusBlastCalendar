name: Build ZEUS POPPERS Calendar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q ZeusBlastCalendar_Android_Project.zip -d android-project

      - name: Find Gradle project
        run: |
          PROJECT_DIR=$(dirname "$(find android-project -name gradlew -type f -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" ./app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEUS-POPPERS-Calendar-APK
          path: app-debug.apk
